<div class="vu" role="img" [attr.aria-label]="label + ' level ' + (rms | number:'1.0-1') + ' dB RMS, peak ' + (peak | number:'1.0-1') + ' dB'">
    <svg viewBox="0 -28 200 160" class="vu-face">
        <rect x="0" y="-28" width="200" height="160" class="dial" />
        <text x="100" y="-12" class="brand">BEATNIK</text>
        <path [attr.d]="scalePath" class="scale" />
        <path [attr.d]="redPath" class="scale red" />
        <ng-container *ngFor="let tick of ticks">
            <line [attr.x1]="tick.x1" [attr.y1]="tick.y1" [attr.x2]="tick.x2" [attr.y2]="tick.y2"
                class="tick" [class.red]="tick.red" />
            <text [attr.x]="tick.labelX" [attr.y]="tick.labelY" class="tick-label" [class.red]="tick.red">
                {{ tick.label }}
            </text>
        </ng-container>
        <text x="100" y="92" class="unit">VU</text>
        <text *ngFor="let end of endMarks" [attr.x]="end.x" [attr.y]="end.y" class="tick-label end-mark"
            [class.red]="end.red">{{ end.label }}</text>
        <text x="8" y="124" class="readout" [class.clip]="isClipping">Peak {{ peakText }} dB</text>
        <g class="needle" [style.transform]="'rotate(' + needleAngle + 'deg)'">
            <line [attr.x1]="pivotX" [attr.y1]="pivotY" [attr.x2]="pivotX" [attr.y2]="pivotY - 89" />
        </g>
        <path [attr.d]="coverPath" class="cover" />
    </svg>
    <ion-text class="ion-padding-top vu-label">{{ label }}</ion-text>
</div>
