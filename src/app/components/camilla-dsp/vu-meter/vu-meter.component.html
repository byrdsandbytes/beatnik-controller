<div class="vu" role="img" [attr.aria-label]="label + ' level ' + (rms | number:'1.0-1') + ' dB RMS'">
    <svg viewBox="0 0 200 125" class="vu-face">
        <rect x="0" y="0" width="200" height="125" class="dial" />
        <path [attr.d]="scalePath" class="scale" />
        <path [attr.d]="redPath" class="scale red" />
        <ng-container *ngFor="let tick of ticks">
            <line [attr.x1]="tick.x1" [attr.y1]="tick.y1" [attr.x2]="tick.x2" [attr.y2]="tick.y2"
                class="tick" [class.red]="tick.red" />
            <text [attr.x]="tick.labelX" [attr.y]="tick.labelY" class="tick-label" [class.red]="tick.red">
                {{ tick.label }}
            </text>
        </ng-container>
        <text x="100" y="92" class="unit">VU</text>
        <g class="needle" [style.transform]="'rotate(' + needleAngle + 'deg)'">
            <line [attr.x1]="pivotX" [attr.y1]="pivotY" [attr.x2]="pivotX" [attr.y2]="pivotY - 84" />
        </g>
        <circle [attr.cx]="pivotX" [attr.cy]="pivotY" r="7" class="hub" />
    </svg>
    <ion-chip class="clip" [color]="isClipping ? 'danger' : 'medium'" [outline]="!isClipping">
        <ion-label>Peak {{ peak | number:'1.0-1' }} dB</ion-label>
    </ion-chip>
    <ion-text class="vu-label">{{ label }}</ion-text>
</div>
