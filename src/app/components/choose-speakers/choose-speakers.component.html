<ion-header>
  <ion-toolbar color="light">
    <ion-title></ion-title>
    <ion-buttons slot="start">
      <ion-button (click)="closeModal()">
        <ion-icon name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button (click)="saveSelection()">
        <!-- <ion-icon slot="end" name="save"></ion-icon> -->
        <ion-label>Save</ion-label>
      </ion-button>
    </ion-buttons>

  </ion-toolbar>

</ion-header>

<ion-content>
  <div class="choose-speakers-container container">
    <h2>Choose your Group Image</h2>

    <ion-toolbar color="light">
      <ion-segment [(ngModel)]="selectedSegment" scrollable>
        <ion-segment-button value="All">All</ion-segment-button>
        <ion-segment-button *ngFor="let type of types" [value]="type">
          {{ type }}
        </ion-segment-button>
      </ion-segment>
    </ion-toolbar>
    <div class="row">
      <div class="col-6" *ngFor="let speaker of filteredSpeakers" [hidden]="selectedSegment !== 'All' && speaker.type !== selectedSegment"
        (click)="selectSpeaker(speaker.id)">
        <img [src]="speaker.image" alt="{{ speaker.manufacturer }} {{ speaker.model }}" class="speaker-image">
        <ion-item lines="none">
          <ion-icon [name]="'checkmark-circle'" *ngIf="selectedId === speaker.id"></ion-icon>
          <ion-label>
            <h2>{{ speaker.manufacturer }} {{ speaker.model }}</h2>
            <p>Year: {{ speaker.year }}</p>
            <p>Type: {{ speaker.type }}</p>
          </ion-label>
        </ion-item>
      </div>
    </div>

    <!-- <div class="row">
      <div class="col-6" *ngFor="let speaker of filteredSpeakers" (click)="selectSpeaker(speaker.id)">
        <img [src]="speaker.image" alt="{{ speaker.manufacturer }} {{ speaker.model }}" class="speaker-image">
        <ion-item lines="none">
          <ion-icon [name]="'checkmark-circle'" *ngIf="selectedId === speaker.id"></ion-icon>
          <ion-label>
            <h2>{{ speaker.manufacturer }} {{ speaker.model }}</h2>
            <p>Year: {{ speaker.year }}</p>
            <p>Type: {{ speaker.type }}</p>
          </ion-label>
        </ion-item>

      </div>
    </div> -->

    <!-- <ion-button expand="full" color="primary" (click)="saveSelection()">
      Save Selection
    </ion-button> -->
  </div>
</ion-content>
<ion-footer>
  <ion-toolbar color="light">
    <ion-searchbar (ionInput)="filterSpeakers($event)"
      placeholder="Search speakers by brand or model..."></ion-searchbar>
  </ion-toolbar>
</ion-footer>
